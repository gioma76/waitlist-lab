name: "Interes en A. Vigilante de caducidades"
description: "Indica que usarias esta idea. Es publico y no se cobra nada."
title: "[interes] A. Vigilante de caducidades"
labels: ["interes"]
body:
  - type: markdown
    attributes:
      value: "Esta idea no existe todavia: solo medimos interes. Esta incidencia es publica y muestra tu usuario de GitHub. No incluyas datos personales ni de clientes."
  - type: dropdown
    id: uso
    attributes:
      label: "Con que frecuencia tendrias este problema?"
      options: ["Cada semana", "Cada mes", "Pocas veces al ano", "Nunca, solo curiosidad"]
    validations:
      required: true
  - type: input
    id: hoy
    attributes:
      label: "Como lo resuelves hoy? (opcional, sin datos personales)"
